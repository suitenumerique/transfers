name: Build and publish OCI images

"on":
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:

  docker-publish-backend:
    uses: ./.github/workflows/docker-publish.yml
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    secrets: inherit
    with:
      image_name: "backend"
      context: "src/backend"
      # distroless/cc + python-build-standalone: no shell, no package
      # manager, ~100 MB. Ships its own CA bundle (SSL_CERT_FILE is set by
      # the base image), so TLS to the SMTP relay verifies out of the box.
      # runtime-prod (debian-slim + entrypoint) stays for local/compose use.
      target: runtime-distroless-prod

  docker-publish-frontend:
    uses: ./.github/workflows/docker-publish.yml
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    secrets: inherit
    with:
      image_name: "frontend"
      context: "src/frontend"
      target: runtime-prod
      # The final runtime-prod stage does `FROM ${FRONTEND_IMAGE}` — passing the
      # already-built amd64 tag here lets the arm64 build reuse the arch-independent
      # Vite bundle instead of rebuilding it.
      arm64_reuse_amd64_build_arg: "FRONTEND_IMAGE"
