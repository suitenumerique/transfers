name: Lint and tests

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

env:
  COMPOSE_BAKE: true

jobs:
  lint-back:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Create env files
        run: make create-env-files
      - name: Run backend linting
        run: make lint-back

  test-back:
    runs-on: ubuntu-latest
    env:
      DOCKER_USER: 1001
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Create env files
        run: make create-env-files
      - name: Setup data directories
        run: |
          mkdir -p data/static
          sudo chown -R 1001:1001 data
      - name: Collect static files
        run: make collectstatic
      - name: Create transfers bucket
        run: make create-bucket
      - name: Run backend tests
        run: make test-back

  lint-front:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Create env files
        run: make create-env-files
      - name: Install frontend dependencies
        run: make install-frozen-front
      - name: Run frontend linting
        run: make lint-front
      - name: Run frontend type check
        run: make typecheck-front

  test-front:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Create env files
        run: make create-env-files
      - name: Install frontend dependencies
        run: make install-frozen-front
      - name: Run frontend tests
        run: make test-front

  build-front:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Create env files
        run: make create-env-files
      - name: Install frontend dependencies
        run: make install-frozen-front
      - name: Build frontend
        run: make build-front

  test-front-distroless:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Builds the production frontend image and exercises Caddy on it:
      # heartbeat, healthcheck, the admin IP allowlist and the trusted
      # proxy handling of X-Forwarded-For.
      - name: Smoke-test the frontend production image
        run: make test-front-distroless
